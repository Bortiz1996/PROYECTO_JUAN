name: Actualizar datos nivel río Calamar

on:
  schedule:
    - cron: "15 0,12,17 * * *"  # diario a las 7:15, 12:15 y 19:15 en Colombia
  workflow_dispatch:          # ejecución manual desde la pestaña Actions

permissions:
  contents: write             # necesario para hacer push del CSV y su versión de fuente

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar scraper IDEAM
        env:
          IDEAM_DHIME_ACCEPT_TERMS: "true"
        run: python scraper_ideam.py

      - name: Commit y push si cambió el CSV o la versión de IDEAM
        run: |
          if [ -n "$(git status --porcelain -- nivel_calamar.csv nivel_calamar_fuente.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- nivel_calamar.csv
            if [ -f nivel_calamar_fuente.json ]; then
              git add -- nivel_calamar_fuente.json
            fi
            git commit -m "Actualización automática nivel Calamar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Datos y versión IDEAM sin cambios; no se hace commit."
          fi
